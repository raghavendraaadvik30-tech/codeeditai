version: "2"
type: frontend
tech_stack:
  - React 19
  - TypeScript 6
  - Vite 8
  - TailwindCSS v4
  - shadcn/ui (Radix UI primitives)
  - Zustand v5
  - TanStack React Query v5
  - react-router-dom v7
  - react-hook-form v7 + zod v4
  - Framer Motion v13
  - Lucide React
  - Iconify React
  - recharts v2
  - react-resizable-panels
  - three.js
  - sonner (toasts)
  - axios
routes:
  - path: /
    file: src/app/router/routes.tsx
    auth_required: false
    description: Root redirector - sends user to login or dashboard based on auth state and role
  - path: /login
    file: src/features/auth/pages/Login.tsx
    auth_required: false
    description: User login page with workspace, email, and password fields
  - path: /forgot-password
    file: src/features/auth/pages/ForgotPassword.tsx
    auth_required: false
    description: Forgot password page
  - path: /reset-password
    file: src/features/auth/components/ResetPassword.tsx
    auth_required: false
    description: Reset password form page
  - path: /dashboard
    file: src/features/dashboard/pages/Dashboard.tsx
    auth_required: true
    description: Admin dashboard home page (Admin role only)
  - path: /dashboard/users
    file: src/features/dashboard/pages/Users.tsx
    auth_required: true
    description: User management page (Admin role only)
  - path: /editor
    file: src/features/editor/EditorPage.tsx
    auth_required: true
    description: Main rich-text document editor page (Admin and Author roles)
features:
  - name: User Login
    description: Login with workspace name, email, and password credentials. Supports role-based redirection after login.
    files:
      - src/features/auth/components/LoginForm.tsx
      - src/features/auth/hooks/useAuth.ts
      - src/features/auth/services/AuthService.ts
    entry_route: /login
    user_interactions:
      - Fill workspace input field
      - Fill email input field
      - Fill password input field
      - Toggle password visibility with eye icon button
      - Click Login button to submit
      - See validation error messages for empty or invalid fields
      - See global error message on failed authentication
      - Click Forgot Password link to navigate to /forgot-password
    api_calls:
      - method: POST
        endpoint: /api/auth/login
    auth_required: false
  - name: Forgot Password
    description: Request a password reset email
    files:
      - src/features/auth/components/ForgotPasswordForm.tsx
      - src/features/auth/pages/ForgotPassword.tsx
    entry_route: /forgot-password
    user_interactions:
      - Fill email input field
      - Click Send Reset Link button
      - See success or error message
    api_calls:
      - method: POST
        endpoint: /api/auth/forgot-password
    auth_required: false
  - name: Reset Password
    description: Set a new password using the reset token from email
    files:
      - src/features/auth/components/ResetPassword.tsx
    entry_route: /reset-password
    user_interactions:
      - Fill new password field
      - Fill confirm password field
      - Click Reset Password button
      - See success or error message
    api_calls:
      - method: POST
        endpoint: /api/auth/reset-password
    auth_required: false
  - name: Admin Dashboard
    description: Admin home page with overview and navigation
    files:
      - src/features/dashboard/pages/Dashboard.tsx
    entry_route: /dashboard
    user_interactions:
      - View dashboard overview
      - Navigate to Users management page
    api_calls: []
    auth_required: true
  - name: User Management
    description: Admin can view and manage application users
    files:
      - src/features/dashboard/pages/Users.tsx
    entry_route: /dashboard/users
    user_interactions:
      - View list of users
      - Search or filter users
    api_calls:
      - method: GET
        endpoint: /api/users
    auth_required: true
  - name: Document Editor
    description: Full-featured rich text document editor with workspace panels, toolbar, sidebar, ruler, and figure/chart support
    files:
      - src/features/editor/components/workspace/Workspace.tsx
      - src/features/editor/components/workspace/Panel.tsx
      - src/features/editor/components/workspace/DocumentRuler.tsx
      - src/features/editor/components/workspace/WorkspaceToolbar.tsx
      - src/features/editor/components/workspace/WorkspaceSidebar.tsx
      - src/features/editor/components/header/EditorHeader.tsx
      - src/features/editor/components/header/HeaderActions.tsx
      - src/features/editor/components/header/HeaderLogo.tsx
      - src/features/editor/components/header/DocumentInfo.tsx
      - src/features/editor/components/header/UserProfile.tsx
      - src/features/editor/components/sidebar/IconSidebar.tsx
      - src/features/editor/components/sidebar/SidebarItem.tsx
      - src/features/editor/components/ribbon/
      - src/features/editor/modules/figures/modules/chart/components/ChartContextMenu.tsx
    entry_route: /editor
    user_interactions:
      - Type and edit text in the document workspace
      - Use toolbar to format text (bold, italic, underline, etc.)
      - Resize panels using drag handles
      - Navigate sidebar icons to switch panels
      - View and interact with document ruler
      - Open chart context menu on figures
      - View user profile in header
      - Access header actions (save, share, export)
    api_calls:
      - method: GET
        endpoint: /api/documents
      - method: POST
        endpoint: /api/documents
      - method: PUT
        endpoint: /api/documents/:id
    auth_required: true
known_limitations: []
